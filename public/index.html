<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      // Resolve the theme before the first paint — doing this in a React effect
      // renders one frame on the wrong canvas. Dark is the default.
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo192.png" />

    <meta name="theme-color" content="#E55A2B" />
    <meta
      name="description"
      content="TrendBag is the fashion-tech platform where you shop what creators love. Discover trending styles from your favorite influencers and buy the exact brands and products they wear — in just a few taps."
    />

    <meta name="author" content="TrendBag" />
